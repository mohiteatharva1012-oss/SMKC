                      <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                          <div className="w-12 h-12 rounded-xl bg-emerald-600/30 border border-emerald-500/40 text-emerald-400 flex items-center justify-center text-xl font-bold">
                            👮
                          </div>
                          <div>
                            <div className="flex items-center gap-2">
                              <h4 className="font-bold text-white text-base">{officerProfile?.name}</h4>
                              <span className="bg-emerald-500/20 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-500/30">
                                Active Officer
                              </span>
                            </div>
                            <p className="text-slate-400 text-xs">
                              {officerProfile?.role} • {officerProfile?.ward}
                            </p>
                          </div>
                        </div>

                        <div className="flex items-center gap-3">
                          <span className="text-xs text-slate-300">एकूण स्कॅन्स: <strong className="text-white font-mono">{scannedSubmissions.length}</strong></span>
                          <button
                            onClick={() => {
                              setOfficerLoggedIn(false);
                              setOfficerProfile(null);
                            }}
                            className="bg-slate-900 hover:bg-red-950/80 text-red-300 hover:text-red-200 border border-slate-700 hover:border-red-700 text-xs font-bold px-3 py-1.5 rounded-xl transition-all"
                          >
                            लॉगआउट (Logout)
                          </button>
                        </div>
                      </div>

                      {/* Success Alert if Updated */}
                      {officerUpdateSuccess && (
                        <div className="p-4 bg-emerald-950/90 border border-emerald-500 rounded-2xl text-emerald-200 text-xs font-bold flex items-center gap-2">
                          <span>✅</span>
                          <span>{officerUpdateSuccess}</span>
                        </div>
                      )}

                      {/* Submissions Queue (Left) & Deep Audit & Progress Slider (Right) */}
                      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        
                        {/* Left: Scanned Submissions Queue */}
                        <div className="lg:col-span-5 space-y-3">
                          <div className="flex items-center justify-between">
                            <h4 className="font-bold text-sm text-white flex items-center gap-2">
                              <span>📥</span>
                              <span>नागरिक स्कॅन्स ({scannedSubmissions.length})</span>
                            </h4>
                            <span className="text-[10px] text-slate-400">निवडण्यासाठी क्लिक करा</span>
                          </div>

                          <div className="space-y-2.5 max-h-[520px] overflow-y-auto pr-1">
                            {scannedSubmissions.map(item => {
                              const isSelected = selectedOfficerScanId === item.id;
                              return (
                                <div
                                  key={item.id}
                                  onClick={() => {
                                    setSelectedOfficerScanId(item.id);
                                    setOfficerStage(item.status);
                                    setOfficerProgressPercent(item.workProgress);
                                    setOfficerRemarks(item.progressRemarks || '');
                                    setOfficerSquad(item.assignedSquad || 'Sangli Enforcement Squad 01');
                                  }}
                                  className={`p-3 rounded-2xl border transition-all cursor-pointer ${
                                    isSelected
                                      ? 'bg-slate-800 border-amber-400 shadow-lg shadow-amber-400/10'
                                      : 'bg-slate-950/70 border-slate-800 hover:bg-slate-800'
                                  }`}
                                >
                                  <div className="flex gap-3">
                                    <img
                                      src={item.imageUrl}
                                      alt="Thumbnail"
                                      className="w-16 h-16 rounded-xl object-cover border border-slate-700 flex-shrink-0"
                                    />
                                    <div className="flex-1 min-w-0 space-y-1">
                                      <div className="flex items-center justify-between gap-2">
                                        <span className="font-mono text-xs font-bold text-amber-400 truncate">{item.id}</span>
                                        <span className="text-[10px] text-slate-400">{item.scanDate}</span>
                                      </div>
                                      <h5 className="font-bold text-xs text-white truncate">{item.citizenName}</h5>
                                      <p className="text-[11px] text-slate-300 truncate">{item.city} • {item.location}</p>
                                      
                                      <div className="pt-1">
                                        <div className="flex justify-between text-[10px] text-slate-400 mb-0.5">
                                          <span>{item.status}</span>
                                          <span className="font-mono text-emerald-400 font-bold">{item.workProgress}%</span>
                                        </div>
                                        <div className="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
                                          <div
                                            className="bg-emerald-500 h-full rounded-full"
                                            style={{ width: `${item.workProgress}%` }}
                                          />
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>

                        {/* Right: Detailed Audit & Work Progress Controls */}
                        <div className="lg:col-span-7 bg-slate-950 rounded-3xl p-5 border border-slate-800 space-y-5">
                          {(() => {
                            const activeItem = scannedSubmissions.find(s => s.id === selectedOfficerScanId) || scannedSubmissions[0];
                            if (!activeItem) return <div className="text-slate-400 text-xs">कोणताही फलक निवडलेला नाही.</div>;

                            return (
                              <>
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800 pb-3">
                                  <div>
                                    <span className="text-[10px] text-amber-400 uppercase font-mono">निवडलेला फलक तपशील</span>
                                    <h4 className="text-base font-black text-white font-mono">{activeItem.id}</h4>
                                  </div>
                                  <div className="text-right">
                                    <span className="text-[10px] text-red-400 block font-bold uppercase">संभाव्य दंड वसुली</span>
                                    <span className="text-base font-black text-red-400 font-mono">₹{activeItem.calculatedFine ? activeItem.calculatedFine.toLocaleString('en-IN') : '१५,०००'}</span>
                                  </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-12 gap-3">
                                  <div className="sm:col-span-5">
                                    <img
                                      src={activeItem.imageUrl}
                                      alt="Full Banner"
                                      className="w-full h-36 object-cover rounded-2xl border border-slate-800"
                                    />
                                  </div>
                                  <div className="sm:col-span-7 space-y-1.5 text-xs bg-slate-900/90 p-3 rounded-2xl border border-slate-800">
                                    <div>
                                      <span className="text-slate-400 text-[10px] block">नागरिक:</span>
                                      <span className="font-bold text-white">{activeItem.citizenName} ({activeItem.citizenPhone})</span>
                                    </div>
                                    <div>
                                      <span className="text-slate-400 text-[10px] block">स्थान:</span>
                                      <span className="text-slate-200">{activeItem.city} • {activeItem.location}</span>
                                    </div>
                                    <div>
                                      <span className="text-slate-400 text-[10px] block">नोंद:</span>
                                      <p className="text-slate-300 italic">{activeItem.notes || 'तक्रार नोंद उपलब्ध नाही'}</p>
                                    </div>
                                  </div>
                                </div>

                                {/* 7-Rule Verdict Bar */}
                                <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-1 text-xs">
                                  <div className="flex justify-between items-center">
                                    <span className="font-bold text-slate-300">मनपा ७-नियम निष्कर्ष:</span>
                                    <span className="text-red-400 font-mono font-bold">{activeItem.overallVerdict || 'Illegal / High Hazard'}</span>
                                  </div>
                                  <div className="grid grid-cols-4 gap-1 text-[10px] text-slate-400 pt-1">
                                    <span>✓ १. हद्द: वैध</span>
                                    <span>✗ २. परवाना: नाही</span>
                                    <span>✗ ३. Setback: बाधा</span>
                                    <span>✓ ४. शांतता: बाहेर</span>
                                    <span>✗ ५. वारा: कच्चा</span>
                                    <span>✗ ६. विद्रूपीकरण: भंग</span>
                                    <span>✗ ७. QR: गहाळ</span>
                                    <span>⚖️ नोटीस: २४ तास</span>
                                  </div>
                                </div>

                                {/* WORK PROGRESS IMPLEMENTATION SLIDER */}
                                <form onSubmit={handleOfficerProgressUpdate} className="bg-slate-900 p-4 rounded-2xl border border-amber-400/40 space-y-3.5 shadow-lg">
                                  <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                                    <h5 className="font-bold text-xs text-amber-300 flex items-center gap-1.5">
                                      <span>⚙️</span>
                                      <span>कामाची प्रगती अंमलबजावणी (Work Progress Implementation)</span>
                                    </h5>
                                    <span className="text-[10px] text-slate-400">थेट डेटाबेसमध्ये नोंद होते</span>
                                  </div>

                                  {/* Slider */}
                                  <div className="space-y-1">
                                    <div className="flex justify-between items-center text-xs">
                                      <label className="font-bold text-slate-300">
                                        प्रगती टक्केवारी:
                                      </label>
                                      <span className="bg-emerald-500/20 text-emerald-300 font-mono font-bold text-xs px-2.5 py-0.5 rounded-full border border-emerald-500/30">
                                        {officerProgressPercent}% पूर्ण
                                      </span>
                                    </div>
                                    <input
                                      type="range"
                                      min="0"
                                      max="100"
                                      step="5"
                                      value={officerProgressPercent}
                                      onChange={e => setOfficerProgressPercent(Number(e.target.value))}
                                      className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-[#c62828]"
                                    />
                                  </div>

                                  {/* Stage & Squad Selectors */}
                                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                                    <div>
                                      <label className="block font-bold text-slate-300 mb-1 text-[11px]">
                                        सद्यस्थिती टप्पा (Execution Stage):
                                      </label>
                                      <select
                                        value={officerStage}
                                        onChange={e => setOfficerStage(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:border-amber-400"
                                      >
                                        <option value="Received (नोंदणीकृत)">Received (नोंदणीकृत - १५%)</option>
                                        <option value="Squad Dispatched (पथक रवाना)">Squad Dispatched (पथक रवाना - ३०%)</option>
                                        <option value="Field Inspection Complete (प्रत्यक्ष पाहणी पूर्ण)">Field Inspection Complete (पाहणी पूर्ण - ५०%)</option>
                                        <option value="Notice Issued (नोटीस जारी)">Notice Issued (२४ तास नोटीस जारी - ६५%)</option>
                                        <option value="Demolition in Progress (निष्कासन कारवाई सुरू)">Demolition in Progress (निष्कासन सुरू - ८०%)</option>
                                        <option value="Resolved & Cleared (कारवाई पूर्ण)">Resolved & Cleared (कारवाई पूर्ण - १००%)</option>
                                      </select>
                                    </div>

                                    <div>
                                      <label className="block font-bold text-slate-300 mb-1 text-[11px]">
                                        नियुक्त अंमलबजावणी पथक:
                                      </label>
                                      <select
                                        value={officerSquad}
                                        onChange={e => setOfficerSquad(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:border-amber-400"
                                      >
                                        <option value="Sangli Enforcement Squad 01">Sangli Enforcement Squad 01</option>
                                        <option value="Miraj Rapid Response Squad">Miraj Rapid Response Squad</option>
                                        <option value="Kupwad Industrial Demolition Unit">Kupwad Demolition Unit</option>
                                      </select>
                                    </div>
                                  </div>

                                  {/* Remarks Textarea */}
                                  <div>
                                    <label className="block font-bold text-slate-300 text-[11px] mb-1">
                                      अधिकाऱ्यांचे प्रत्यक्ष कारवाई शेरे व निर्देश:
                                    </label>
                                    <textarea
                                      rows="2"
                                      value={officerRemarks}
                                      onChange={e => setOfficerRemarks(e.target.value)}
                                      placeholder="उदा. पथक रवाना झाले असून फलक काढण्याची मोहीम प्रगतीत आहे..."
                                      className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:border-amber-400"
                                    />
                                  </div>

                                  <div className="flex items-center justify-between pt-1">
                                    <span className="text-[10px] text-slate-400">
                                      नागरिकांच्या ट्रॅकरवर लगेच अद्ययावत होते.
                                    </span>
                                    <button
                                      type="submit"
                                      className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition-all shadow"
                                    >
                                      कामाची प्रगती अद्ययावत करा ✓
                                    </button>
                                  </div>
                                </form>
                              </>
                            );
                          })()}
                        </div>

                      </div>
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SMKCApp />);
  </script>
</body>
</html>
