                          value={modalCitizenData.notes}
                          onChange={e => setModalCitizenData({ ...modalCitizenData, notes: e.target.value })}
                          className="w-full text-xs px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-[#c62828] focus:outline-none"
                        />
                      </div>

                      <div className="flex items-center justify-between pt-2">
                        <button
                          type="button"
                          onClick={() => setScannerModalStep('capture')}
                          className="text-xs font-bold text-slate-500 hover:text-slate-800 px-3 py-2"
                        >
                          ← मागे जा (Back)
                        </button>
                        <button
                          type="submit"
                          className="bg-[#c62828] hover:bg-[#b71c1c] text-white font-bold text-xs px-6 py-3 rounded-xl shadow-lg transition-all hover:scale-105 active:scale-95"
                        >
                          मनपा डेटाबेसमध्ये नोंदणी करा (Submit to Database) →
                        </button>
                      </div>
                    </form>
                  )}

                  {/* STEP 4: SUCCESS RECEIPT & TRACKING TOKEN */}
                  {scannerModalStep === 'success' && (
                    <div className="space-y-6 text-center">
                      <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl mx-auto shadow-inner">
                        ✓
                      </div>

                      <div className="space-y-1">
                        <h4 className="text-xl font-black text-slate-900">
                          स्कॅन यशस्वीरित्या मनपा डेटाबेसमध्ये नोंदवला गेला!
                        </h4>
                        <p className="text-xs text-slate-500">
                          आपली तक्रार अधिकृतपणे नोंदवली गेली असून संबंधित प्रभाग अधिकाऱ्यांना वर्ग करण्यात आली आहे.
                        </p>
                      </div>

                      {/* Tracking Token Badge */}
                      <div className="bg-slate-900 text-white p-5 rounded-2xl max-w-md mx-auto space-y-2 border border-slate-800 shadow-xl">
                        <span className="text-[10px] text-amber-400 uppercase font-mono font-bold tracking-wider">
                          अधिकृत ट्रॅकिंग टोकन क्रमांक (Official Token)
                        </span>
                        <div className="text-2xl font-mono font-black text-amber-300">
                          {lastSubmittedToken}
                        </div>
                        <button
                          type="button"
                          onClick={() => {
                            if (navigator.clipboard) {
                              navigator.clipboard.writeText(lastSubmittedToken);
                              alert(`टोकन कॉपी केले: ${lastSubmittedToken}`);
                            }
                          }}
                          className="inline-block bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1 rounded-lg border border-slate-700"
                        >
                          📋 टोकन कॉपी करा
                        </button>
                      </div>

                      {/* Summary Box */}
                      <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 max-w-md mx-auto text-left text-xs space-y-2">
                        <div className="flex justify-between">
                          <span className="text-slate-500">तक्रारदार:</span>
                          <span className="font-bold text-slate-900">{modalCitizenData.name} ({modalCitizenData.phone})</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">स्थान:</span>
                          <span className="font-bold text-slate-900">{modalCitizenData.city} • {modalCitizenData.location || 'मुख्य रस्ता'}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">प्रारंभिक दंड वसुली:</span>
                          <span className="font-bold text-red-600 font-mono">₹१६,००० (MMC Act Sec 244)</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">कामाची सद्यस्थिती:</span>
                          <span className="font-bold text-emerald-600">Received (नोंदणीकृत - १५%)</span>
                        </div>
                      </div>

                      {/* Action Navigation Buttons */}
                      <div className="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
                        <button
                          type="button"
                          onClick={() => {
                            setIsScannerModalOpen(false);
                            const el = document.getElementById('officer-portal-section');
                            if (el) el.scrollIntoView({ behavior: 'smooth' });
                          }}
                          className="w-full sm:w-auto bg-slate-900 hover:bg-slate-800 text-amber-300 font-bold text-xs px-6 py-3 rounded-xl transition-all shadow"
                        >
                          ↓ खाली अधिकारी कक्षात कामाची प्रगती पहा (Track Progress Below)
                        </button>

                        <button
                          type="button"
                          onClick={() => setIsScannerModalOpen(false)}
                          className="w-full sm:w-auto bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs px-6 py-3 rounded-xl transition-all"
                        >
                          पूर्ण झाले (Close)
                        </button>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SMKCApp />);
  </script>
</body>
</html>
